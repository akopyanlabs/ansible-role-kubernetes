- name: "Kubernetes Upgrade: -- Get administrative master node --"
  ansible.builtin.import_tasks:
    file: enviroment/get-master.yml

- name: "Kubernetes Upgrade: -- Validate preconditions --"
  become: true
  run_once: true
  block:
    - name: "Kubernetes Upgrade: -- Check target version format --"
      ansible.builtin.fail:
        msg: "kubernetes_upgrade_version must be set to an exact X.Y.Z version, e.g. \"1.34.3\""
      when: kubernetes_upgrade_version is not regex('^\d+\.\d+\.\d+$')

    - name: "Kubernetes Upgrade: -- Get current cluster version --"
      ansible.builtin.command:
        cmd: kubectl version -o json
      register: kubernetes_upgrade_kubectl_version
      delegate_to: "{{ administrative_master_node }}"
      changed_when: false

    - name: "Kubernetes Upgrade: -- Set current version fact --"
      ansible.builtin.set_fact:
        kubernetes_upgrade_current_version: "{{ (kubernetes_upgrade_kubectl_version.stdout | from_json).serverVersion.gitVersion | regex_replace('^v', '') }}"

    - name: "Kubernetes Upgrade: -- Get node kubelet versions --"
      ansible.builtin.command:
        cmd: kubectl get nodes -o json
      register: kubernetes_upgrade_nodes_json
      delegate_to: "{{ administrative_master_node }}"
      changed_when: false

    - name: "Kubernetes Upgrade: -- Set version facts and lagging nodes --"
      # cluster == target is a valid RESUME state: control plane already
      # upgraded, some kubelets may still lag behind
      ansible.builtin.set_fact:
        kubernetes_upgrade_cur: "{{ kubernetes_upgrade_current_version.split('.') | map('int') | list }}"
        kubernetes_upgrade_tgt: "{{ kubernetes_upgrade_version.split('.') | map('int') | list }}"
        kubernetes_upgrade_lagging_nodes: "{{ kubernetes_upgrade_nodes_json.stdout | from_json
            | json_query('items[?status.nodeInfo.kubeletVersion != `v' ~ kubernetes_upgrade_version ~ '`].metadata.name') }}"

    - name: "Kubernetes Upgrade: -- Show lagging nodes --"
      ansible.builtin.debug:
        msg: "Nodes still below v{{ kubernetes_upgrade_version }}: {{ kubernetes_upgrade_lagging_nodes | join(', ') | default('<none>') }}"

    - name: "Kubernetes Upgrade: -- Check version step --"
      ansible.builtin.fail:
        msg: >-
          {{ 'Cluster is already at v' ~ kubernetes_upgrade_version ~ ' — nothing to upgrade'
             if (kubernetes_upgrade_tgt == kubernetes_upgrade_cur) and (kubernetes_upgrade_lagging_nodes | length == 0)
             else ('Downgrade ' ~ kubernetes_upgrade_current_version ~ ' -> ' ~ kubernetes_upgrade_version ~ ' is not supported'
                   if kubernetes_upgrade_tgt < kubernetes_upgrade_cur
                   else ('Unsupported upgrade step ' ~ kubernetes_upgrade_current_version ~ ' -> ' ~ kubernetes_upgrade_version ~ ':
                         one minor at a time only, patch upgrades allowed.
                         Run kubernetes_upgrade_cluster repeatedly for multi-step upgrades.' | trim)) }}
      when: >-
        (kubernetes_upgrade_tgt < kubernetes_upgrade_cur)
        or ((kubernetes_upgrade_tgt == kubernetes_upgrade_cur) and (kubernetes_upgrade_lagging_nodes | length == 0))
        or (kubernetes_upgrade_tgt[0] != kubernetes_upgrade_cur[0])
        or (kubernetes_upgrade_tgt[1] >= kubernetes_upgrade_cur[1] + 2)

    - name: "Kubernetes Upgrade: -- Check all nodes are Ready --"
      ansible.builtin.command:
        cmd: kubectl get nodes --no-headers
      register: kubernetes_upgrade_nodes_status
      delegate_to: "{{ administrative_master_node }}"
      changed_when: false

    - name: "Kubernetes Upgrade: -- Fail if any node is not Ready --"
      ansible.builtin.fail:
        msg: "Not all nodes are Ready:\n{{ kubernetes_upgrade_nodes_status.stdout }}"
      when: kubernetes_upgrade_nodes_status.stdout_lines | reject('search', '\sReady(\s|$)') | list | length > 0

- name: "Kubernetes Upgrade: -- Backup etcd --"
  when: kubernetes_upgrade_etcd_backup | bool
  become: true
  run_once: true
  delegate_to: "{{ administrative_master_node }}"
  block:
    - name: "Kubernetes Upgrade: -- Remove leftover backup pod --"
      # pod spec is immutable: a pod stuck from a previous run must be
      # deleted before a fixed definition can be applied
      kubernetes.core.k8s:
        state: absent
        kind: Pod
        namespace: kube-system
        name: kubernetes-upgrade-etcd-backup
      failed_when: false

    - name: "Kubernetes Upgrade: -- Set backup file name --"
      # controller clock timestamp keeps names unique and lexically sortable
      ansible.builtin.set_fact:
        kubernetes_upgrade_backup_file: "snapshot-pre-{{ kubernetes_upgrade_version }}-{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}.db"

    - name: "Kubernetes Upgrade: -- Run etcd snapshot pod --"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: kubernetes-upgrade-etcd-backup
            namespace: kube-system
          spec:
            nodeName: "{{ administrative_master_node | lower }}"
            # hostNetwork is required: etcd listens on the node's 127.0.0.1,
            # which is unreachable from the pod network namespace
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            restartPolicy: Never
            containers:
              - name: etcdctl
                image: "{{ kubernetes_upgrade_etcd_image }}"
                env:
                  - name: ETCDCTL_API
                    value: "3"
                command: ["/bin/sh", "-c"]
                args:
                  - >-
                    etcdctl --endpoints=https://127.0.0.1:2379
                    --cacert=/etc/kubernetes/pki/etcd/ca.crt
                    --cert=/etc/kubernetes/pki/etcd/server.crt
                    --key=/etc/kubernetes/pki/etcd/server.key
                    snapshot save /backup/{{ kubernetes_upgrade_backup_file }}
                volumeMounts:
                  - { name: etcd-data, mountPath: /backup }
                  - { name: etcd-certs, mountPath: /etc/kubernetes/pki/etcd, readOnly: true }
            volumes:
              - name: etcd-data
                hostPath: { path: /var/lib/etcd, type: Directory }
              - name: etcd-certs
                hostPath: { path: /etc/kubernetes/pki/etcd, type: Directory }

    - name: "Kubernetes Upgrade: -- Wait for etcd snapshot pod --"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: kube-system
        name: kubernetes-upgrade-etcd-backup
      register: kubernetes_upgrade_backup_pod
      until: (kubernetes_upgrade_backup_pod.resources[0].status.phase | default('')) in ['Succeeded', 'Failed']
      retries: 20
      delay: 5

    - name: "Kubernetes Upgrade: -- Show backup pod logs on failure --"
      ansible.builtin.command:
        cmd: kubectl -n kube-system logs kubernetes-upgrade-etcd-backup
      when: kubernetes_upgrade_backup_pod.resources[0].status.phase == 'Failed'
      changed_when: false

    - name: "Kubernetes Upgrade: -- Fail if snapshot pod failed --"
      ansible.builtin.fail:
        msg: "etcd snapshot pod failed — see logs above"
      when: kubernetes_upgrade_backup_pod.resources[0].status.phase == 'Failed'

    - name: "Kubernetes Upgrade: -- Remove etcd snapshot pod --"
      kubernetes.core.k8s:
        state: absent
        kind: Pod
        namespace: kube-system
        name: kubernetes-upgrade-etcd-backup

    - name: "Kubernetes Upgrade: -- Check snapshot file --"
      ansible.builtin.stat:
        path: "/var/lib/etcd/{{ kubernetes_upgrade_backup_file }}"
      register: kubernetes_upgrade_snapshot_stat

    - name: "Kubernetes Upgrade: -- Fail if snapshot is missing --"
      ansible.builtin.fail:
        msg: "etcd snapshot {{ kubernetes_upgrade_backup_file }} was not created on {{ administrative_master_node }}:/var/lib/etcd/"
      when: not kubernetes_upgrade_snapshot_stat.stat.exists

    - name: "Kubernetes Upgrade: -- Rotate etcd snapshots (keep last 3) --"
      # matches both the new timestamped names and the legacy snapshot-pre-<ver>.db
      ansible.builtin.shell: |
        cd /var/lib/etcd
        ls -1t snapshot-pre-*.db 2>/dev/null | tail -n +4 | while read -r f; do
          echo "removing ${f}"
          rm -f "${f}"
        done
      register: kubernetes_upgrade_backup_rotation
      changed_when: kubernetes_upgrade_backup_rotation.stdout_lines | length > 0

- name: "Kubernetes Upgrade: -- Upgrade first control-plane node --"
  become: true
  run_once: true
  block:
    - name: "Kubernetes Upgrade: -- Confirm upgrade of the first control-plane node --"
      # asked only when this node still has work to do (fresh run or its
      # kubelet lags); in resume mode with the node already upgraded the
      # whole block turns into a no-op and no prompt appears
      ansible.builtin.pause:
        prompt: "Upgrade {{ administrative_master_node }} (FIRST control-plane node) to v{{ kubernetes_upgrade_version }}? (yes/no, no skips it — note: secondary nodes will then fail): "
      register: kubernetes_upgrade_confirm_result
      when:
        - kubernetes_upgrade_confirm | bool
        - >-
          kubernetes_upgrade_current_version != kubernetes_upgrade_version
          or administrative_master_node in kubernetes_upgrade_lagging_nodes

    - name: "Kubernetes Upgrade: -- Abort on invalid confirmation --"
      ansible.builtin.fail:
        msg: "Please answer exactly 'yes' or 'no'"
      when:
        - kubernetes_upgrade_confirm | bool
        - (kubernetes_upgrade_confirm_result.user_input | default('yes') | lower) not in ['yes', 'no']

    - name: "Kubernetes Upgrade: -- First control-plane flow --"
      # runs only when the node has work (fresh run or its kubelet lags);
      # otherwise unhold would leave the already-upgraded node's packages
      # unlocked with no following install to re-hold them
      when: >-
        (kubernetes_upgrade_confirm_result.user_input | default('yes') | lower) != 'no'
        and (kubernetes_upgrade_current_version != kubernetes_upgrade_version
             or administrative_master_node in kubernetes_upgrade_lagging_nodes)
      block:
        - name: "Kubernetes Upgrade: -- Packages on first control-plane node --"
          ansible.builtin.include_tasks:
            file: upgrade/node-packages.yml
          vars:
            kubernetes_upgrade_node: "{{ administrative_master_node }}"

        - name: "Kubernetes Upgrade: -- Apply upgrade on first control-plane node --"
          # skipped in resume mode: control plane already at the target
          # (cluster version == target), only kubelets lag behind
          ansible.builtin.command:
            cmd: "kubeadm upgrade apply --yes v{{ kubernetes_upgrade_version }}"
          delegate_to: "{{ administrative_master_node }}"
          when: kubernetes_upgrade_current_version != kubernetes_upgrade_version
          changed_when: true
          register: kubernetes_upgrade_apply_result

        - name: "Kubernetes Upgrade: -- Show upgrade apply result --"
          ansible.builtin.debug:
            var: kubernetes_upgrade_apply_result
          when: kubernetes_upgrade_apply_result is defined

        - name: "Kubernetes Upgrade: -- Restart kubelet on first control-plane node --"
          ansible.builtin.systemd:
            name: kubelet
            state: restarted
          delegate_to: "{{ administrative_master_node }}"
          when: administrative_master_node in kubernetes_upgrade_lagging_nodes

    - name: "Kubernetes Upgrade: -- Skipped first control-plane node --"
      ansible.builtin.debug:
        msg: "Skipped {{ administrative_master_node }} by operator decision — the cluster upgrade is incomplete"
      when:
        - kubernetes_upgrade_confirm | bool
        - (kubernetes_upgrade_confirm_result.user_input | default('yes') | lower) == 'no'

- name: "Kubernetes Upgrade: -- Upgrade secondary control-plane nodes --"
  # lagging nodes only: already-upgraded nodes are skipped silently
  ansible.builtin.include_tasks:
    file: upgrade/node-upgrade.yml
  loop: "{{ groups[kubernetes_master_group_name] | difference([administrative_master_node]) | intersect(kubernetes_upgrade_lagging_nodes) }}"
  loop_control:
    loop_var: kubernetes_upgrade_node
  run_once: true

- name: "Kubernetes Upgrade: -- Upgrade worker nodes --"
  ansible.builtin.include_tasks:
    file: upgrade/node-worker.yml
  loop: "{{ groups[kubernetes_worker_group_name] | default([]) | intersect(kubernetes_upgrade_lagging_nodes) }}"
  loop_control:
    loop_var: kubernetes_upgrade_node
  run_once: true

- name: "Kubernetes Upgrade: -- Show cluster state --"
  become: true
  run_once: true
  delegate_to: "{{ administrative_master_node }}"
  block:
    - name: "Kubernetes Upgrade: -- Get nodes --"
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      register: kubernetes_upgrade_nodes_result
      changed_when: false

    - name: "Kubernetes Upgrade: -- Show nodes --"
      ansible.builtin.debug:
        var: kubernetes_upgrade_nodes_result.stdout_lines

    - name: "Kubernetes Upgrade: -- Refresh lagging nodes --"
      # re-run of the validation-time list against the upgraded cluster
      ansible.builtin.command:
        cmd: kubectl get nodes -o json
      register: kubernetes_upgrade_nodes_json
      changed_when: false

    - name: "Kubernetes Upgrade: -- Warn if some nodes lag behind --"
      ansible.builtin.debug:
        msg: >-
          WARNING: nodes still older than v{{ kubernetes_upgrade_version }}:
          {{ kubernetes_upgrade_nodes_json.stdout | from_json
             | json_query('items[?status.nodeInfo.kubeletVersion != `v' ~ kubernetes_upgrade_version ~ '`].metadata.name') }}
      when: >-
        (kubernetes_upgrade_nodes_json.stdout | from_json
         | json_query('items[?status.nodeInfo.kubeletVersion != `v' ~ kubernetes_upgrade_version ~ '`].metadata.name')) | length > 0
