- name: "Kubernetes: -- Get administrative master node --"
  ansible.builtin.import_tasks:
    file: enviroment/get-master.yml

- name: "Kubernetes: -- Check if worker node is already joined --"
  ansible.builtin.stat:
    path: "/etc/kubernetes/kubelet.conf"
  register: kubernetes_worker_kubelet_conf_stat
  become: true

- name: "Kubernetes: -- Set list of joined worker nodes --"
  # только хосты текущего play: stat гарантированно выполнен на каждом из них;
  # hostvars остальных нод при --limit переменную не содержат
  ansible.builtin.set_fact:
    kubernetes_workers_joined: >-
      {%- set joined = [] -%}
      {%- for h in ansible_play_hosts | intersect(groups[kubernetes_worker_group_name] | default([])) -%}
      {%-   if hostvars[h].kubernetes_worker_kubelet_conf_stat.stat.exists | default(false) -%}
      {%-     set _ = joined.append(h) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{- joined -}}

- name: "Kubernetes: -- Set list of worker nodes pending join --"
  ansible.builtin.set_fact:
    kubernetes_workers_pending_join: >-
      {{ ansible_play_hosts
         | intersect(groups[kubernetes_worker_group_name] | default([]))
         | difference(kubernetes_workers_joined) }}

- name: "Kubernetes: -- Get join command --"
  ansible.builtin.command:
    cmd: "kubeadm token create --ttl 120m --print-join-command"
  register: k8s_join_command
  run_once: true
  delegate_to: "{{ administrative_master_node }}"
  when: kubernetes_workers_pending_join | length > 0

- name: "Kubernetes: -- Join worker node --"
  become: true
  when:
    - inventory_hostname != administrative_master_node
    - inventory_hostname in (groups[kubernetes_worker_group_name] | default([]))
    - not (kubernetes_worker_kubelet_conf_stat.stat.exists | default(false))
  block:
    - name: "Kubernetes: -- Prepare OS  --"
      ansible.builtin.include_tasks: "prepare/main.yml"

    - name: "Kubernetes: -- Install components --"
      ansible.builtin.include_tasks: "components/main.yml"

    - name: "Kubernetes: -- Wait for local kubernetes API endpoint --"
      ansible.builtin.wait_for:
        host: "{{ kubernetes_loadbalancer_apiserver_ip }}"
        port: "{{ kubernetes_loadbalancer_apiserver_port }}"
        timeout: 30

    - name: "Kubernetes: -- Join worker node  --"
      ansible.builtin.command:
        cmd: "{{ k8s_join_command.stdout }}"
      register: k8s_join_worker_result

    - name: "Kubernetes: -- Show join worker result   --"
      ansible.builtin.debug:
        var: k8s_join_worker_result

    - name: "Kubernetes: -- Cordon worker node  --"
      kubernetes.core.k8s:
        api_version: v1
        kind: Node
        name: "{{ inventory_hostname | lower}}"
        state: present
        definition:
          spec:
            unschedulable: true
      delegate_to: "{{ administrative_master_node }}"
      when: "'kubernetes_first_init' is not in ansible_run_tags"

    - name: "Kubernetes: -- Apply worker node {{ inventory_hostname }} label --"
      ansible.builtin.include_tasks:
        file: enviroment/node-labels.yml
