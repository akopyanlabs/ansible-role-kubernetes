- name: "Kubernetes Prepare: -- Ensure  system hostname is FQDN --"
  block:
    - name: Set system hostname to FQDN
      ansible.builtin.hostname:
        name: "{{ inventory_hostname | lower }}"

- name: "Kubernetes Prepare: -- Load the br_netfilter kernel module --"
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: "Kubernetes Prepare: -- Ensure br_netfilter is loaded on boot --"
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/containerd.conf
    line: "{{ item }}"
    create: true
    state: present
  loop:
    - br_netfilter
    - overlay

- name: "Kubernetes Prepare: -- Set sysctl parameters --"
  block:
    - name: "Kubernetes Prepare: -- Copy kubernetes sysctl config --"
      ansible.builtin.template:
        src: sysctl/99-kubernetes.conf.j2
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
      register: kubernetes_sysctl_config

    - name: "Kubernetes Prepare: -- Apply sysctl parameters --"
      # sysctl --system picks up the new file and applies it immediately;
      # modules-load (see above) guarantees br_netfilter before bridge-nf-* keys
      ansible.builtin.command:
        cmd: sysctl --system
      when: kubernetes_sysctl_config.changed
      changed_when: false
  become: true

- name: "Kubernetes Prepare: -- Disable firewalld --"
  when: kubernetes_disable_firewalld | bool
  block:
    - name: "Kubernetes Prepare: -- Check if firewalld is active --"
      ansible.builtin.command:
        cmd: "systemctl is-active firewalld"
      register: kubernetes_firewalld_status
      changed_when: false
      failed_when: false

    - name: "Kubernetes Prepare: -- Stop and disable firewalld --"
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
      when: kubernetes_firewalld_status.stdout == "active"

- name: "Kubernetes Prepare: -- Disable swap --"
  ansible.builtin.command: "swapoff -a"
  become: true

- name: "Kubernetes Prepare: -- Remove current swaps from fstab --"
  ansible.builtin.lineinfile:
    dest: /etc/fstab
    regexp: '(?i)^([^#][\S]+\s+(none|swap)\s+swap.*)'
    line: '# \1'
    backrefs: true
    state: present
  become: true

- name: "Kubernetes Prepare: -- Create kube-api audit policy --"
  block:
    - name: "Kubernetes Prepare: -- Ensure audit policy folder exists --"
      ansible.builtin.file:
        path: "{{ kubernetes_kubeapi_audit_policy_hostpath }}"
        state: directory
      become: true
    - name: "Kubernetes Prepare: -- Copy audit policy file --"
      ansible.builtin.template:
        src: policies/audit-policy.yml.j2
        dest: "{{ kubernetes_kubeapi_audit_policy_file }}"
        mode: "0644"
      become: true
  when: inventory_hostname in groups[kubernetes_master_group_name]
